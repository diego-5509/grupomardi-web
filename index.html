<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grupo Mardi — Coming Soon</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #f0f0f0;
      text-align: center;
      padding: 2rem;
    }

    .container {
      max-width: 640px;
    }

    .logo {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 3rem;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      color: #ffffff;
    }

    h1 span {
      color: #c9a84c;
      font-weight: 600;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.8;
      color: #999;
      margin-bottom: 3rem;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: #c9a84c;
      margin: 0 auto 3rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #c9a84c;
      border: 1px solid #c9a84c33;
      padding: 0.5rem 1.25rem;
      border-radius: 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Grupo Mardi</div>
    <h1>Something <span>great</span><br>is coming</h1>
    <div class="divider"></div>
    <p>
      Welcome to Grupo Mardi. Our new website is currently under construction.
      We are working on something great — stay tuned!
    </p>
    <div class="badge">Coming Soon</div>
  </div>
</body>
</html>
